<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <!-- Обязательный viewport для корректного отображения внутри Telegram -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GirlFit — забота о себе по фазам цикла</title>
    <!-- Заглушка favicon, чтобы браузер не запрашивал /favicon.ico (404 в логах) -->
    <link rel="icon" href="data:,">
    <!-- Скрипт Telegram: открывает объект Telegram.WebApp для JS -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Веб-шрифты (гарантированная доставка); локальные @font-face в style.css
         остаются как офлайн-фолбэк с теми же семействами и весами -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== Сегодня (главный) ===== -->
    <main id="screen-today" class="screen">
        <div id="today-content" class="section-gap"><!-- рендерит screens/today.js (шапка — тоже там) --></div>
    </main>

    <!-- ===== Цикл ===== -->
    <main id="screen-cycle" class="screen hidden">
        <div id="cycle-content" class="section-gap"><!-- рендерит screens/cycle.js (шапка — тоже там) --></div>
    </main>

    <!-- ===== Активность ===== -->
    <main id="screen-activity" class="screen hidden">
        <div id="activity-content" class="section-gap"><!-- рендерит screens/activity.js (шапка — тоже там) --></div>
    </main>

    <!-- ===== Питание ===== -->
    <main id="screen-nutrition" class="screen hidden">
        <div id="nutrition-content" class="section-gap"><!-- рендерит screens/nutrition.js (шапка — тоже там) --></div>
    </main>

    <!-- ===== Привычки ===== -->
    <main id="screen-habits" class="screen hidden">
        <div id="habits-content" class="section-gap"><!-- рендерит screens/habits.js (шапка — тоже там) --></div>
    </main>

    <!-- ===== Профиль ===== -->
    <main id="screen-profile" class="screen hidden">
        <div id="profile-content" class="section-gap"><!-- рендерит screens/profile.js (шапка — тоже там) --></div>
    </main>

    <!-- ===== Подэкран: страница фазы ===== -->
    <main id="screen-phase" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <header id="phase-header" class="phase-header"></header>
        <section id="phase-sections" class="stack"></section>
    </main>

    <!-- ===== Подэкран: карточка дня цикла ===== -->
    <main id="screen-day" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <div id="day-card" class="stack"></div>
    </main>

    <!-- ===== Подэкран: тренировка (до/во время/после) ===== -->
    <main id="screen-workout" class="screen hidden">
        <button class="back-button" data-back id="workout-back">← Назад</button>
        <div id="workout-player" class="stack"></div>
    </main>

    <!-- ===== Подэкран: видеотренировка (Kinescope-плеер) ===== -->
    <main id="screen-video" class="screen hidden">
        <button class="back-button" data-back id="video-back">← Назад</button>
        <div id="video-player" class="stack"></div>
    </main>

    <!-- ===== Подэкран: рецепт ===== -->
    <main id="screen-recipe" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <div id="recipe-card" class="stack"></div>
    </main>

    <!-- ===== Подэкран: конструктор тарелки ===== -->
    <main id="screen-plate" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <div id="plate-builder" class="stack"></div>
    </main>

    <!-- ===== Подэкран: добавить привычку ===== -->
    <main id="screen-habit-add" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <div id="habit-add-content" class="stack"></div>
    </main>

    <!-- ===== Подэкран: прогресс/статистика ===== -->
    <main id="screen-stats" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <div id="stats-content" class="stack"></div>
    </main>

    <!-- ===== Подэкран: настройки ===== -->
    <main id="screen-settings" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <div id="settings-content" class="stack"></div>
    </main>

    <!-- ===== Подэкран: FAQ ===== -->
    <main id="screen-faq" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <div id="faq-content" class="stack"></div>
    </main>

    <!-- ===== Подэкран: юридический документ ===== -->
    <main id="screen-legal" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <div id="legal-content" class="stack"></div>
    </main>

    <!-- ===== Подэкран: уровни ===== -->
    <main id="screen-levels" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <header class="page-header">
            <h1>Уровни</h1>
            <p id="levels-subtitle" class="subtitle"></p>
        </header>
        <div id="levels-content" class="stack"></div>
    </main>

    <!-- ===== Подэкран: достижения ===== -->
    <main id="screen-achievements" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <header class="page-header">
            <h1>Достижения</h1>
            <p id="achievements-subtitle" class="subtitle"></p>
        </header>
        <div id="achievements-content" class="stack"></div>
    </main>

    <!-- ===== Подэкран: мои призы ===== -->
    <main id="screen-rewards" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <header class="page-header">
            <h1>Мои призы</h1>
            <p id="rewards-subtitle" class="subtitle"></p>
        </header>
        <div id="rewards-content" class="stack"></div>
    </main>

    <!-- ===== Подэкран: напоминания ===== -->
    <main id="screen-reminders" class="screen hidden">
        <button class="back-button" data-back>← Назад</button>
        <header class="page-header">
            <h1>Напоминания</h1>
            <p id="reminders-subtitle" class="subtitle"></p>
        </header>
        <div id="reminders-content" class="stack"></div>
    </main>

    <!-- ===== Экран «открыто вне Telegram» ===== -->
    <main id="screen-notg" class="screen hidden">
        <section class="card notg-card">
            <h1>Это приложение живёт внутри Telegram</h1>
            <p class="subtitle">Откройте его через нашего бота: перейдите в чат
            с ботом и нажмите кнопку «Открыть приложение» — тогда всё
            заработает, а данные сохранятся в вашем личном кабинете.</p>
        </section>
    </main>

    <!-- ===== Onboarding (5 шагов) ===== -->
    <div id="onboarding" class="onboarding-overlay hidden"></div>

    <!-- ===== Модальные окна ===== -->
    <div id="modal-root"></div>

    <!-- Нижняя навигация: 6 разделов, fixed + safe-area.
         Подэлементы с class="nf" при активной вкладке заливаются (--olive)
         через CSS: .nav-item.active svg .nf { fill: currentColor } -->
    <nav class="bottom-nav" id="bottom-nav">
        <button class="nav-item active" data-nav="today">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="nf" d="m3 10.2 9-7.2 9 7.2V20a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9.2 22v-7.6h5.6V22"/></svg>
            <span>Сегодня</span>
        </button>
        <button class="nav-item" data-nav="cycle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.8v3.7M16 2.8v3.7"/><rect class="nf" x="3" y="4.5" width="18" height="17" rx="2.6"/></svg>
            <span>Цикл</span>
        </button>
        <button class="nav-item" data-nav="activity">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="nf" d="M2.6 9.9v4.2M5.9 7.4v9.2M18.1 7.4v9.2M21.4 9.9v4.2"/><path d="M5.9 12h12.2"/></svg>
            <span>Активность</span>
        </button>
        <button class="nav-item" data-nav="nutrition">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path class="nf" d="M6.2 2.5v19"/><path class="nf" d="M3.5 2.5v5.2a2.7 2.7 0 0 0 5.4 0V2.5"/><path class="nf" d="M17.8 2.5c-1.7 1.2-2.7 3.4-2.7 6v4.3h3.4v8.7"/></svg>
            <span>Питание</span>
        </button>
        <button class="nav-item" data-nav="habits">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21.5v-8.3"/><path class="nf" d="M12 13.2c0-4.6 3.3-7.7 8.6-7.7 0 4.9-3.5 7.7-8.6 7.7Z"/><path class="nf" d="M12 13.2c0-4.1-2.9-7-7.6-7 0 4.3 3 7 7.6 7Z"/></svg>
            <span>Привычки</span>
        </button>
        <button class="nav-item" data-nav="profile">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle class="nf" cx="12" cy="7.6" r="4.1"/><path class="nf" d="M4.4 21.5v-1.6a4.9 4.9 0 0 1 4.9-4.9h5.4a4.9 4.9 0 0 1 4.9 4.9v1.6"/></svg>
            <span>Профиль</span>
        </button>
    </nav>

    <script src="cycle.js"></script>
    <script src="app.js"></script>
    <script src="gamification.js"></script>
    <script src="onboarding.js"></script>
    <script src="components.js"></script>
    <script src="screens/today.js"></script>
    <script src="screens/cycle.js"></script>
    <script src="screens/activity.js"></script>
    <script src="screens/nutrition.js"></script>
    <script src="screens/habits.js"></script>
    <script src="screens/profile.js"></script>
    <script src="screens/levels.js"></script>
    <script src="screens/achievements.js"></script>
    <script src="screens/rewards.js"></script>
    <script src="screens/reminders.js"></script>
</body>
</html>
